[package]
name = "oniwa-pipeline"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Data ingestion, ethical crawling, and cleaning pipelines for the ONIWA ecosystem."

[[bin]]
name = "oniwa-dataset"
path = "src/main.rs"

[dependencies]
oniwa-lm = { path = "../crates/oniwa-lm" }
encoding_rs = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
