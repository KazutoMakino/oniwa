[package]
name = "oniwa-lm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure Rust minimal training engine inspired by llm.c, adopting modern transformer primitives (RMSNorm, RoPE, SwiGLU, GQA)."

[dependencies]
# Fast matrix multiplication (Pure Rust/assembly optimizations equivalent to OpenBLAS/BLIS)
matrixmultiply = "0.3"

# CPU multi-core parallelism
rayon = "1.10"

# Zero-copy token loading via memory-mapped files
memmap2 = "0.9"

# Deterministic pseudo-random number generation (guaranteeing bitwise identical results across platforms)
rand = "0.8"
rand_chacha = "0.3"

# Auditable serialization and logging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SHA-256 cryptographic checksum verification for weights, datasets, and steps
sha2 = "0.10"

