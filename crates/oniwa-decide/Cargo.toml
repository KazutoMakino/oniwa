[package]
name = "oniwa-decide"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TypeSafe System One decision engine powered by bidirectional Transformer, outputting Choice, Score, and Noul with calibrated confidence."

[dependencies]
oniwa-lm = { path = "../oniwa-lm" }

# Fast matrix multiplication (Pure Rust/assembly optimizations equivalent to OpenBLAS/BLIS)
matrixmultiply = "0.3"

# CPU multi-core parallelism
rayon = "1.10"

# Deterministic pseudo-random number generation (reproducibility)
rand = "0.8"
rand_chacha = "0.3"

# Serialization and logging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptographic hashing
sha2 = "0.10"
