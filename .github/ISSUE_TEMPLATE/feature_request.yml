name: 💡 機能提案・改善要望 (Feature Request)
description: 新機能の追加やアーキテクチャの改善アイデアを提案します
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます！ONIWA の思想（脱データセンター・Pure Rust・出自の完全透明性・省電力エッジ知性）に合致する提案を歓迎します。
  - type: textarea
    id: motivation
    attributes:
      label: 提案の背景・解決したい課題
      description: なぜこの機能や改善が必要か、現状どのような課題があるかを記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容・実装のアイデア
      description: 提案する機能やアルゴリズム、アーキテクチャの詳細を具体的に記載してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案（あれば）
      description: 他に検討したアプローチや、他プロジェクトでの参考事例があれば記載してください。
