name: 💡 機能提案・改善要望 / Feature Request
description: 新機能やアーキテクチャ改善の提案 / Suggest an idea or architectural improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます！ONIWA の思想（脱データセンター・Pure Rust・出自の完全透明性・省電力エッジ知性）に合致する提案を歓迎します。  
        *Thank you for your proposal! We warmly welcome ideas aligned with ONIWA's core philosophy (Organic, Non-datacenter, Pure Rust, 100% Provenance, ~5W Edge Intelligence).*
  - type: textarea
    id: motivation
    attributes:
      label: 提案の背景・解決したい課題 / Problem or Motivation
      description: なぜこの機能や改善が必要か、現状どのような課題があるかを記載してください。 / Why is this feature needed, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容・実装のアイデア / Proposed Solution or Implementation Idea
      description: 提案する機能やアルゴリズム、アーキテクチャの詳細を具体的に記載してください。 / Describe the feature, algorithm, or architecture you would like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案（あれば） / Alternative Solutions Considered
      description: 他に検討したアプローチや、他プロジェクトでの参考事例があれば記載してください。 / Mention any alternative approaches or references you've considered.
