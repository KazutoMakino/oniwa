name: 🐛 バグ報告 / Bug Report
description: 予期しないエラーや不具合の報告 / Report an unexpected error or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        バグの報告ありがとうございます。問題の迅速な特定・再現のため、可能な限り詳細な情報をご記入ください。  
        *Thank you for reporting a bug! Please provide as much detail as possible to help us reproduce and resolve the issue quickly.*
  - type: textarea
    id: description
    attributes:
      label: 発生した問題・バグの概要 / Problem Description
      description: どのような問題が発生したかを簡潔に記載してください。 / Provide a clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順 / Steps to Reproduce
      description: 問題を再現するための具体的な手順を記載してください。 / Provide exact steps to reproduce the behavior.
      placeholder: |
        1. Run `cargo run --release -p oniwa-pipeline -- --all`
        2. Run `cargo run --release -p oniwa-lm --bin train -- --steps 100`
        3. See error message / 〇〇のエラーメッセージが表示される
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: ログ・エラー出力 / Logs and Error Output
      description: ターミナルに出力されたスタックトレースやログを貼り付けてください。 / Paste terminal logs or stack traces.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: 実行環境 / Environment Information
      description: OS、ハードウェア（PC / Raspberry Pi 4等）、Rustのバージョンを記載してください。 / Specify OS, hardware (PC / Raspberry Pi 4, etc.), and Rust version.
      placeholder: |
        - OS: Ubuntu 24.04 LTS / Raspberry Pi OS (64-bit) / macOS / Windows
        - Hardware: Raspberry Pi 4 Model B (4GB) / x86_64 PC
        - Rust Version: `rustc --version`
    validations:
      required: true
